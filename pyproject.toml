[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-system"
version = "1.0.0"
description = "A deterministic, storyboard-driven AI filmmaking pipeline."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["streamlit>=1.38"]
workers = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
all = ["pytest>=8.0", "streamlit>=1.38", "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
ai-content = "ai_content.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
